name: Build and deploy course site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you rebuild by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/ is pre-built locally (./sync.sh && web/build_site.sh, from the
      # LaTeX sources in ../Notes, ../Tutorials etc., which are NOT part of
      # this repo) and committed as plain Markdown + SVG. CI's only job is to
      # turn that into a static site -- no LaTeX/pandoc toolchain needed here
      # any more. If a page looks stale after a content edit, the fix is to
      # rebuild locally and commit docs/ again, not to change this workflow.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict -d site_build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
